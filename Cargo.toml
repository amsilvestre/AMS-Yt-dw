[package]
name = "ams-yt-dw"
version = "1.3.0"
edition = "2021"
build = "build.rs"
description = "Interface grafica para o yt-dlp: baixe videos e audios do YouTube e de centenas de outros sites"
authors = ["Andre Silvestre"]
license = "MIT"
homepage = "https://github.com/amsilvestre/AMS-Yt-dw"
repository = "https://github.com/amsilvestre/AMS-Yt-dw"
readme = "README.md"

[dependencies]
slint = "1"
rfd = "0.14"
dirs = "5"
qrcode = "0.14"
arboard = "3"

[build-dependencies]
slint-build = "1"
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[profile.release]
opt-level = 3
lto = true
strip = true

# ── Empacotamento Linux ───────────────────────────────────────────────────────
# Dependencias derivadas de medicao real: `ldd` para as ligadas e /proc/PID/maps
# para as carregadas via dlopen (que o ldd nao mostra). Ver docs/LINUX_PORT.md.

[package.metadata.deb]
maintainer = "Andre Silvestre <silvestre.andre@gmail.com>"
section = "video"
priority = "optional"
# Explicito de proposito: as libs de janela/GL sao abertas via dlopen, entao o
# dpkg-shlibdeps ($auto) nao as detectaria de qualquer forma.
depends = "libc6, libgcc-s1, libfontconfig1, libxkbcommon0, libwayland-client0, libwayland-egl1, libegl1, ffmpeg"
recommends = "yt-dlp"
suggests = "nodejs"
extended-description = """Interface grafica em Rust/Slint para o yt-dlp. Permite escolher qualidade, container, extrair somente audio, baixar playlists, recortar trechos, incorporar legendas e thumbnail e remover segmentos via SponsorBlock."""
assets = [
    ["target/release/ams-yt-dw", "usr/bin/", "755"],
    ["packaging/ams-yt-dw.desktop", "usr/share/applications/", "644"],
    ["assets/icon_window.png", "usr/share/icons/hicolor/256x256/apps/ams-yt-dw.png", "644"],
    ["README.md", "usr/share/doc/ams-yt-dw/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "Interface grafica para o yt-dlp"
# auto-req (padrao) resolve sozinho as libs ligadas; aqui vao as que o binario
# abre via dlopen e as ferramentas externas.
# "(ffmpeg or ffmpeg-free)" e uma dependencia rica do RPM: no Fedora o ffmpeg
# pleno vive no RPM Fusion, mas o ffmpeg-free do repo principal ja atende.
requires = { fontconfig = "*", libxkbcommon = "*", libwayland-client = "*", libwayland-egl = "*", libglvnd-egl = "*", "(ffmpeg or ffmpeg-free)" = "*" }
recommends = { yt-dlp = "*" }
assets = [
    { source = "target/release/ams-yt-dw", dest = "/usr/bin/ams-yt-dw", mode = "755" },
    { source = "packaging/ams-yt-dw.desktop", dest = "/usr/share/applications/ams-yt-dw.desktop", mode = "644" },
    { source = "assets/icon_window.png", dest = "/usr/share/icons/hicolor/256x256/apps/ams-yt-dw.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/ams-yt-dw/README.md", mode = "644", doc = true },
]
